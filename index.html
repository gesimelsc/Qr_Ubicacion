<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obteniendo ubicación...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Localizando dispositivo...</h2>
        <div class="spinner"></div>
        <p>Por favor, permite el acceso a tu ubicación cuando el navegador lo solicite.</p>
    </div>

    <script>
        function obtenerUbicacion() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        // Redirige a Google Maps usando las coordenadas actuales del celular
                        window.location.href = `https://www.google.com/maps?q=${lat},${lon}`;
                    },
                    function(error) {
                        alert("No se pudo obtener la ubicación. Asegúrate de dar permisos de GPS en tu navegador.");
                        console.error(error);
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                alert("Tu navegador no soporta geolocalización.");
            }
        }

        // Ejecutar al cargar la página
        window.onload = obtenerUbicacion;
    </script>
</body>
</html>
